*.visualizer.*.interfaceTableVisualizer.displayInterfaceTables = true
*.visualizer.*.interfaceTableVisualizer.nodeFilter = "server1 or server2 or host1 or host2 or host3 or host4 or host5 or host6 or host7 or host8"
*.visualizer.*.interfaceTableVisualizer.format = "%m"

