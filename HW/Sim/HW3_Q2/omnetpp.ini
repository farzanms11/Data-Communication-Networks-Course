[General]
network = topology.VLAN
sim-time-limit = 10s
VLAN.host1.numApps = 2
VLAN.host8.numApps = 1
VLAN.host1.app[*].typename = "PingApp"
VLAN.host8.app[*].typename = "PingApp"
VLAN.host1.app[0].destAddr = "host4"
VLAN.host1.app[1].destAddr = "host7"
VLAN.host8.app[0].destAddr = "host6"
VLAN.host1.app[*].printPing = true

VLAN.*.interfaceTable.displayAddresses = true

VLAN.*.bridging.typename = "BridgingLayer"
VLAN.*.bridging.macTableModule = ""
VLAN.switch*.bridging.directionReverser.reverser.forwardPcp = false
VLAN.host*.bridging.directionReverser.typename = ""
VLAN.host*.bridging.interfaceRelay.typename = ""
VLAN.*.ieee8021q.typename = "Ieee8021qProtocol"

