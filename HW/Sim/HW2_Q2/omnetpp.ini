[Part1]
network = topology.Part1

Part1.wiredSource.numApps = 1
Part1.wiredSource.app[0].typename = "PingApp"
Part1.wiredSource.app[0].destAddr = "wiredDestination"

Part1.linkVisualizer.*.displayLinks = true
Part1.linkVisualizer.*.fadeOutTime = 2s

[Part2]
network = topology.Part2
Part2.source*.numApps = 1
Part2.source*.app[0].typename = "PingApp"

Part2.source1.app[0].destAddr = "destination1"
Part2.source1.app[0].startTime = 1s
Part2.source2.app[0].destAddr = "destination2"
Part2.source2.app[0].startTime = 2s
Part2.source3.app[0].destAddr = "destination3"
Part2.source3.app[0].startTime = 1.5s

Part2.visualizer.*.dataLinkVisualizer.displayLinks = true
Part2.visualizer.*.dataLinkVisualizer.fadeOutMode = "simulationTime"
Part2.visualizer.*.dataLinkVisualizer.fadeOutTime = 0.45s
Part2.visualizer.*.dataLinkVisualizer.packetFilter = "ping*"

Part2.visualizer.*.dataLinkVisualizer.nodeFilter = "source3 or etherSwitch{1,5,4} or destination3"