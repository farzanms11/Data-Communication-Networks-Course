[Part1]
network = topology.Part1
sim-time-limit = 1s

Part1.source.numApps = 1
Part1.source.app[0].typename = "UdpSourceApp"
Part1.source.app[0].source.productionInterval = exponential(400us)
Part1.source.app[0].source.packetLength = ask
Part1.source.app[0].io.destAddress = "destination"
Part1.source.app[0].io.destPort = 1

Part1.destination.numApps = 1
Part1.destination.app[0].typename = "UdpSinkApp"
Part1.destination.app[0].io.localPort = 1

Part1.*.ethernet.typename = "EthernetLayer"
Part1.*.eth[*].typename = "LayeredEthernetInterface"
Part1.*.eth[*].bitrate = 100Mbps

